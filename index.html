<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSAI Video Generator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b16;
  color:white;
}

header{
  text-align:center;
  padding:25px 15px;
  background:#10162b;
}

header h1{
  margin:0;
  color:#4da6ff;
  font-size:32px;
}

header p{
  color:#aeb9d4;
}

.container{
  max-width:800px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#111936;
  border:1px solid #29365f;
  border-radius:18px;
  padding:25px;
}

label{
  display:block;
  margin-bottom:10px;
  font-weight:bold;
}

textarea{
  width:100%;
  height:130px;
  resize:none;
  padding:15px;
  border-radius:12px;
  border:none;
  outline:none;
  background:#202b4d;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#1683ff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#006bd6;
}

#status{
  text-align:center;
  margin-top:20px;
  color:#9fb0d8;
}

video{
  width:100%;
  margin-top:20px;
  border-radius:15px;
  display:none;
}

.download{
  display:none;
  text-align:center;
  margin-top:15px;
  padding:14px;
  background:#20a464;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  color:#65739b;
}
</style>
</head>

<body>

<header>
  <h1>🤖 RSAI</h1>
  <p>AI Video Generator</p>
</header>

<div class="container">

<div class="card">

<label>🎬 Describe your video</label>

<textarea id="prompt"
placeholder="Example: A cinematic cricket match in a packed stadium, dramatic lighting, slow motion..."></textarea>

<button onclick="generateVideo()">
🚀 Generate Video
</button>

<div id="status"></div>

<video id="video" controls></video>

<a id="download" class="download" download="rsai-video.mp4">
⬇️ Download Video
</a>

</div>

</div>

<footer>
© 2026 RSAI | RS FRONT
</footer>

<script>

async function generateVideo(){

  const prompt = document.getElementById("prompt").value.trim();
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const download = document.getElementById("download");

  if(!prompt){
    alert("Please enter a video prompt!");
    return;
  }

  status.innerHTML =
    "⏳ Video generation is being prepared...";

  video.style.display="none";
  download.style.display="none";

  /*
    AI VIDEO API CONNECTION WILL GO HERE.

    IMPORTANT:
    Never put a private API key directly
    inside this public GitHub Pages file.
  */

  setTimeout(() => {

    status.innerHTML =
      "⚠️ AI video API is not connected yet.<br>" +
      "Next step: connect the video generation backend.";

  },1000);
}

</script>

</body>
</html>
