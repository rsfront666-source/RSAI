<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSAI Video Generator</title>

<style>
body{
  background:#080b16;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
textarea{
  width:90%;
  max-width:600px;
  height:120px;
  padding:15px;
  border-radius:10px;
  background:#151a2e;
  color:white;
  font-size:18px;
}
button{
  margin:15px;
  padding:15px 25px;
  border:0;
  border-radius:10px;
  background:#008cff;
  color:white;
  font-size:18px;
  font-weight:bold;
}
canvas{
  width:90%;
  max-width:360px;
  background:black;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🎬 RSAI Video Generator</h1>

<textarea id="text">Hello from RSAI!</textarea>

<br>

<button onclick="startVideo()">🚀 Generate Video</button>

<p id="status"></p>

<canvas id="canvas" width="720" height="1280"></canvas>

<br>

<a id="download" style="display:none">
<button>⬇️ Download Video</button>
</a>

<script>

function startVideo(){

const text=document.getElementById("text").value;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

status.innerText="Generating...";

let stream=canvas.captureStream(30);

let recorder=new MediaRecorder(stream);
let data=[];

recorder.ondataavailable=function(e){
if(e.data.size>0)data.push(e.data);
};

recorder.onstop=function(){

let blob=new Blob(data,{type:"video/webm"});
let url=URL.createObjectURL(blob);

let link=document.getElementById("download");

link.href=url;
link.download="RSAI-video.webm";
link.style.display="inline";

status.innerText="✅ Video Ready!";

};

recorder.start();

let start=Date.now();

function draw(){

let time=(Date.now()-start)/1000;

ctx.fillStyle="#080b16";
ctx.fillRect(0,0,720,1280);

ctx.fillStyle="white";
ctx.font="bold 60px Arial";
ctx.textAlign="center";

ctx.fillText(
text.substring(0,35),
360,
640
);

if(time<5){

requestAnimationFrame(draw);

}else{

recorder.stop();

}

}

draw();

}

</script>

</body>
</html>
