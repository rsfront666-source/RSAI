<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RSAI Shorts Video Generator</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070914;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
padding:22px;
background:#0d1122;
}

h1{
margin:0;
color:#00e5ff;
}

.container{
max-width:600px;
margin:auto;
padding:18px;
}

.card{
background:#11172b;
padding:20px;
border-radius:18px;
}

label{
display:block;
margin:12px 0 6px;
font-weight:bold;
}

textarea,select{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #343c5c;
background:#080b16;
color:white;
font-size:16px;
}

textarea{
height:150px;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:12px;
background:#008cff;
color:white;
font-size:17px;
font-weight:bold;
}

button:hover{
opacity:.85;
}

canvas{
display:block;
width:100%;
max-width:360px;
margin:25px auto;
border-radius:15px;
background:#000;
}

#download{
display:none;
background:#16a34a;
}

#status{
text-align:center;
color:#00e5ff;
margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>🎬 RSAI Shorts Generator</h1>
<p>Free • 9:16 • TTS</p>
</header>

<div class="container">

<div class="card">

<label>📝 Video Script</label>

<textarea id="text">This is a new RSAI Shorts video! Follow for more amazing videos.</textarea>

<label>🎙️ Voice</label>

<select id="voice"></select>

<button onclick="testVoice()">🔊 Test Voice</button>

<button onclick="generate()">🚀 Generate 9:16 Video</button>

<p id="status"></p>

<canvas id="canvas" width="720" height="1280"></canvas>

<button id="download">⬇️ Download Video</button>

</div>

</div>

<script>

const voiceBox=document.getElementById("voice");

function loadVoices(){

let voices=speechSynthesis.getVoices();

voiceBox.innerHTML="";

voices.forEach((v,i)=>{

let option=document.createElement("option");

option.value=i;

option.textContent=v.name+" - "+v.lang;

voiceBox.appendChild(option);

});

}

speechSynthesis.onvoiceschanged=loadVoices;

loadVoices();


function testVoice(){

let text=document.getElementById("text").value;

speechSynthesis.cancel();

let voices=speechSynthesis.getVoices();

let index=parseInt(voiceBox.value)||0;

let u=new SpeechSynthesisUtterance(text);

if(voices[index])u.voice=voices[index];

u.rate=1;
u.pitch=1;
u.volume=1;

speechSynthesis.speak(u);
}


function generate(){

let text=document.getElementById("text").value.trim();

if(!text){

alert("Enter your script first!");

return;
}

let canvas=document.getElementById("canvas");

let ctx=canvas.getContext("2d");

let status=document.getElementById("status");

let download=document.getElementById("download");

status.innerText="🎬 Creating Shorts...";

download.style.display="none";

let stream=canvas.captureStream(30);

let recorder=new MediaRecorder(stream);

let chunks=[];

recorder.ondataavailable=e=>{

if(e.data.size>0){

chunks.push(e.data);

}

};

recorder.onstop=()=>{

let blob=new Blob(chunks,{
type:"video/webm"
});

let url=URL.createObjectURL(blob);

download.style.display="block";

download.onclick=()=>{

let a=document.createElement("a");

a.href=url;

a.download="RSAI-Shorts.webm";

a.click();

};

status.innerText="✅ Shorts Ready!";
};


let voices=speechSynthesis.getVoices();

let index=parseInt(voiceBox.value)||0;

let voice=new SpeechSynthesisUtterance(text);

if(voices[index])voice.voice=voices[index];

voice.rate=1;
voice.pitch=1;
voice.volume=1;


recorder.start();

speechSynthesis.cancel();

speechSynthesis.speak(voice);


let start=performance.now();

let duration=Math.max(
5,
Math.min(15,text.length/12)
);


function frame(now){

let elapsed=(now-start)/1000;

let p=elapsed/duration;


// Background

let gradient=ctx.createLinearGradient(
0,0,720,1280
);

gradient.addColorStop(
0,
"#020617"
);

gradient.addColorStop(
.5,
"#111827"
);

gradient.addColorStop(
1,
"#1e1b4b"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
720,
1280
);


// Animated circles

let x=360+
Math.sin(elapsed*2)*220;

let y=350+
Math.cos(elapsed*1.5)*150;

ctx.fillStyle="#008cff";

ctx.globalAlpha=.25;

ctx.beginPath();

ctx.arc(
x,
y,
170,
0,
Math.PI*2
);

ctx.fill();

ctx.globalAlpha=1;


// Main title

ctx.textAlign="center";

ctx.fillStyle="#00e5ff";

ctx.font="bold 30px Arial";

ctx.fillText(
"RSAI SHORTS",
360,
120
);


// Script text

ctx.fillStyle="white";

ctx.font="bold 48px Arial";

let words=text.split(" ");

let lines=[];

let line="";

for(let word of words){

let test=line+word+" ";

if(ctx.measureText(test).width>600){

lines.push(line);

line=word+" ";

}else{

line=test;

}

}

if(line)lines.push(line);


let lineHeight=70;

let totalHeight=
lines.length*lineHeight;

let yStart=
640-totalHeight/2;


lines.forEach((l,i)=>{

ctx.fillText(
l,
360,
yStart+i*lineHeight
);

});


// Progress bar

ctx.fillStyle="#333";

ctx.fillRect(
80,
1100,
560,
12
);

ctx.fillStyle="#00e5ff";

ctx.fillRect(
80,
1100,
560*Math.min(p,1),
12
);


// Footer

ctx.font="bold 26px Arial";

ctx.fillStyle="white";

ctx.fillText(
"Follow for more 🚀",
360,
1170
);


if(elapsed<duration){

requestAnimationFrame(frame);

}else{

recorder.stop();

}

}

requestAnimationFrame(frame);

}

</script>

</body>
  </html>
