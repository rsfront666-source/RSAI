<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cudu AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070b14;
  color:white;
  height:100vh;
  overflow:hidden;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#0d1322;
  border-bottom:1px solid #202a3d;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#5b8cff;
}

.new-chat{
  border:0;
  background:#5b8cff;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.chat{
  height:calc(100vh - 135px);
  overflow-y:auto;
  padding:20px 15px 30px;
}

.welcome{
  text-align:center;
  margin-top:18vh;
}

.welcome h1{
  font-size:34px;
  margin-bottom:10px;
}

.welcome p{
  color:#9ca8bd;
}

.message{
  max-width:850px;
  margin:14px auto;
  display:flex;
}

.user{
  justify-content:flex-end;
}

.bot{
  justify-content:flex-start;
}

.bubble{
  max-width:80%;
  padding:13px 16px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user .bubble{
  background:#315edb;
  border-bottom-right-radius:4px;
}

.bot .bubble{
  background:#151d2d;
  border:1px solid #26324a;
  border-bottom-left-radius:4px;
}

.typing{
  color:#9ca8bd;
  font-style:italic;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0d1322;
  border-top:1px solid #202a3d;
  padding:12px;
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:8px;
  background:#151d2d;
  border:1px solid #2a3852;
  border-radius:14px;
  padding:7px;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px;
  font-size:16px;
  height:45px;
}

textarea::placeholder{
  color:#77849b;
}

.send{
  width:45px;
  border:0;
  border-radius:10px;
  background:#5b8cff;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send:hover,
.new-chat:hover{
  opacity:.85;
}

@media(max-width:600px){
  .welcome h1{
    font-size:28px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 <span>Cudu</span> AI</div>
  <button class="new-chat" onclick="newChat()">＋ New Chat</button>
</header>

<main class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>🤖 Welcome to Cudu AI</h1>
    <p>Ask me anything...</p>
  </div>

</main>

<div class="input-area">
  <div class="input-box">

    <textarea
      id="message"
      placeholder="Message Cudu AI..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const welcome = document.getElementById("welcome");

function addMessage(text,type){

  if(welcome){
    welcome.style.display="none";
  }

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function botReply(text){

  const lower = text.toLowerCase();

  if(lower.includes("hello") ||
     lower.includes("hi") ||
     lower.includes("hey")){

    return "Hello! 👋 I'm Cudu AI. How can I help you today?";
  }

  if(lower.includes("who are you")){

    return "I'm Cudu AI 🤖, your simple AI assistant.";
  }

  if(lower.includes("youtube")){

    return "I can help you with YouTube titles, descriptions, thumbnails, scripts and video ideas. 🎬";
  }

  if(lower.includes("cricket")){

    return "🏏 I can help you create cricket video titles, descriptions, thumbnail text and highlight ideas.";
  }

  if(lower.includes("help")){

    return "Sure! 🤝 Ask me something and I'll try to help.";
  }

  return "I received your message: \"" + text + "\"\n\nCudu AI is ready! 🤖";
}

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value="";

  const typing = document.createElement("div");
  typing.className="message bot";
  typing.id="typing";

  const bubble=document.createElement("div");
  bubble.className="bubble typing";
  bubble.textContent="Cudu AI is typing...";

  typing.appendChild(bubble);
  chat.appendChild(typing);

  chat.scrollTop=chat.scrollHeight;

  setTimeout(()=>{

    typing.remove();

    addMessage(botReply(text),"bot");

  },700);
}

function handleKey(event){

  if(event.key==="Enter" && !event.shiftKey){

    event.preventDefault();
    sendMessage();

  }
}

function newChat(){

  chat.innerHTML="";

  const newWelcome=document.createElement("div");

  newWelcome.className="welcome";

  newWelcome.innerHTML=`
    <h1>🤖 Welcome to Cudu AI</h1>
    <p>Ask me anything...</p>
  `;

  chat.appendChild(newWelcome);

  input.focus();
}

input.focus();

</script>

</body>
  </html>
