<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSAI Video Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b16;
  color:white;
}

header{
  text-align:center;
  padding:25px 15px;
  background:#10152a;
  border-bottom:1px solid #252b48;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  color:#aaa;
}

.container{
  max-width:700px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:#11172b;
  border:1px solid #252b48;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

textarea,
input[type="file"]{
  width:100%;
  background:#080b16;
  color:white;
  border:1px solid #303754;
  border-radius:10px;
  padding:12px;
  margin-bottom:15px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  margin-top:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  opacity:.9;
}

button:disabled{
  background:#444;
  cursor:not-allowed;
}

.preview{
  width:100%;
  max-width:360px;
  aspect-ratio:9/16;
  margin:15px auto;
  background:#05070d;
  border:2px dashed #303754;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

video{
  width:100%;
  max-width:360px;
  display:block;
  margin:15px auto;
  border-radius:12px;
  background:#000;
}

.status{
  text-align:center;
  color:#aaa;
  margin-top:12px;
  min-height:20px;
}

.small{
  font-size:13px;
  color:#888;
  margin-top:-8px;
  margin-bottom:15px;
}

footer{
  text-align:center;
  color:#666;
  padding:25px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 RSAI Video Generator</h1>
  <p>Create short AI-style videos for YouTube & Social Media</p>
</header>

<div class="container">

  <div class="card">

    <label>📝 Video Script</label>

    <textarea id="script"
      placeholder="Type your video script here..."></textarea>

    <label>🖼️ Upload Image</label>

    <input
      type="file"
      id="imageInput"
      accept="image/*">

    <div class="small">
      Upload a JPG, PNG or WEBP image for your video.
    </div>

    <div class="preview" id="preview">
      <span id="previewText">Image Preview</span>
    </div>

    <button id="voiceBtn">
      🔊 Generate Voice
    </button>

    <button id="videoBtn">
      🎬 Generate Video
    </button>

    <div class="status" id="status"></div>

  </div>

  <div class="card">

    <h2>🎥 Video Preview</h2>

    <video
      id="video"
      controls
      playsinline>
    </video>

    <button id="downloadBtn" disabled>
      ⬇️ Download Video
    </button>

  </div>

</div>

<footer>
  RSAI Video Generator © 2026
</footer>

<script>

let uploadedImage = null;
let generatedVideoURL = null;

/* =========================
   IMAGE UPLOAD
========================= */

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewText = document.getElementById("previewText");

imageInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please upload an image file.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    uploadedImage = new Image();

    uploadedImage.onload = function(){

      preview.innerHTML = "";

      const img = document.createElement("img");
      img.src = e.target.result;

      preview.appendChild(img);

      setStatus("✅ Image uploaded successfully!");

    };

    uploadedImage.src = e.target.result;

  };

  reader.readAsDataURL(file);

});


/* =========================
   STATUS
========================= */

function setStatus(message){
  document.getElementById("status").textContent = message;
}


/* =========================
   TEXT TO SPEECH
========================= */

const voiceBtn = document.getElementById("voiceBtn");

voiceBtn.addEventListener("click", function(){

  const text = document.getElementById("script").value.trim();

  if(!text){
    alert("Please enter your script first.");
    return;
  }

  if(!("speechSynthesis" in window)){
    alert("Text-to-Speech is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 1;
  speech.pitch = 1;
  speech.volume = 1;

  speech.onstart = function(){
    setStatus("🔊 Voice playing...");
  };

  speech.onend = function(){
    setStatus("✅ Voice finished.");
  };

  speech.onerror = function(){
    setStatus("❌ Voice error.");
  };

  speechSynthesis.speak(speech);

});


/* =========================
   VIDEO GENERATOR
========================= */

const videoBtn = document.getElementById("videoBtn");

videoBtn.addEventListener("click", async function(){

  const script = document.getElementById("script").value.trim();

  if(!script){
    alert("Please enter a video script.");
    return;
  }

  if(!uploadedImage){
    alert("Please upload an image first.");
    return;
  }

  if(!window.MediaRecorder){
    alert("Your browser does not support video recording.");
    return;
  }

  videoBtn.disabled = true;

  setStatus("🎬 Creating video...");

  try{

    const canvas = document.createElement("canvas");

    canvas.width = 720;
    canvas.height = 1280;

    const ctx = canvas.getContext("2d");

    const stream = canvas.captureStream(30);

    const chunks = [];

    let recorder;

    try{
      recorder = new MediaRecorder(stream,{
        mimeType:"video/webm;codecs=vp9"
      });
    }catch(e){
      recorder = new MediaRecorder(stream);
    }

    recorder.ondataavailable = function(e){

      if(e.data.size > 0){
        chunks.push(e.data);
      }

    };

    recorder.onstop = function(){

      const blob = new Blob(chunks,{
        type:"video/webm"
      });

      generatedVideoURL = URL.createObjectURL(blob);

      const video = document.getElementById("video");

      video.src = generatedVideoURL;

      document.getElementById("downloadBtn").disabled = false;

      setStatus("✅ Video created successfully!");

      videoBtn.disabled = false;

    };

    recorder.start();

    const duration = 8000;

    const startTime = Date.now();

    function draw(){

      const elapsed = Date.now() - startTime;

      const progress = elapsed / duration;

      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      /* Image */

      const imgRatio =
        uploadedImage.width / uploadedImage.height;

      const canvasRatio =
        canvas.width / canvas.height;

      let drawWidth;
      let drawHeight;
      let x;
      let y;

      if(imgRatio > canvasRatio){

        drawHeight = canvas.height;
        drawWidth = drawHeight * imgRatio;

        x = (canvas.width - drawWidth) / 2;
        y = 0;

      }else{

        drawWidth = canvas.width;
        drawHeight = drawWidth / imgRatio;

        x = 0;
        y = (canvas.height - drawHeight) / 2;

      }

      /* Zoom animation */

      const zoom = 1 + progress * 0.08;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.save();

      ctx.translate(centerX,centerY);
      ctx.scale(zoom,zoom);
      ctx.translate(-centerX,-centerY);

      ctx.drawImage(
        uploadedImage,
        x,
        y,
        drawWidth,
        drawHeight
      );

      ctx.restore();

      /* Dark overlay */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          canvas.height
        );

      gradient.addColorStop(0,"rgba(0,0,0,0.05)");
      gradient.addColorStop(0.65,"rgba(0,0,0,0.15)");
      gradient.addColorStop(1,"rgba(0,0,0,0.75)");

      ctx.fillStyle = gradient;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      /* Script text */

      const words = script.split(/\s+/);

      const maxWords = Math.ceil(
        words.length * Math.min(progress + 0.15,1)
      );

      const visibleText =
        words.slice(0,maxWords).join(" ");

      ctx.fillStyle = "#ffffff";

      ctx.textAlign = "center";

      ctx.font =
        "bold 42px Arial";

      const maxWidth = 620;

      const lines = [];

      let line = "";

      const textWords =
        visibleText.split(" ");

      textWords.forEach(word => {

        const test =
          line + word + " ";

        if(
          ctx.measureText(test).width
          > maxWidth
        ){

          lines.push(line);

          line = word + " ";

        }else{

          line = test;

        }

      });

      if(line){
        lines.push(line);
      }

      const lineHeight = 55;

      const startY =
        canvas.height - 250;

      lines.forEach((text,index)=>{

        ctx.fillStyle =
          "rgba(0,0,0,0.65)";

        const width =
          ctx.measureText(text).width + 30;

        ctx.fillRect(
          centerX - width/2,
          startY + index*lineHeight - 40,
          width,
          58
        );

        ctx.fillStyle = "#ffffff";

        ctx.fillText(
          text,
          centerX,
          startY + index*lineHeight
        );

      });

      if(elapsed < duration){

        requestAnimationFrame(draw);

      }else{

        recorder.stop();

      }

    }

    draw();

  }catch(error){

    console.error(error);

    setStatus("❌ Video generation failed.");

    videoBtn.disabled = false;

  }

});


/* =========================
   DOWNLOAD
========================= */

const downloadBtn =
  document.getElementById("downloadBtn");

downloadBtn.addEventListener("click",function(){

  if(!generatedVideoURL){
    return;
  }

  const a =
    document.createElement("a");

  a.href = generatedVideoURL;

  a.download =
    "RSAI_Video.webm";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

});

</script>

</body>
  </html>
