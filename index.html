<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSAI AI Video Generator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#070a14;
  color:white;
}

header{
  text-align:center;
  padding:25px 15px;
  background:#10162b;
  border-bottom:1px solid #292f4d;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  color:#aaa;
  margin:8px 0 0;
}

.container{
  max-width:720px;
  margin:auto;
  padding:18px;
}

.card{
  background:#11172b;
  border:1px solid #292f4d;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 8px;
}

textarea,
input[type="file"]{
  width:100%;
  background:#080b16;
  color:white;
  border:1px solid #343b5d;
  border-radius:10px;
  padding:13px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  background:#444;
}

.preview{
  width:100%;
  max-width:360px;
  aspect-ratio:9/16;
  margin:15px auto;
  border:2px dashed #343b5d;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05070d;
  color:#777;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

video{
  display:block;
  width:100%;
  max-width:360px;
  margin:15px auto;
  border-radius:14px;
  background:#000;
}

.status{
  text-align:center;
  color:#aaa;
  min-height:24px;
  margin-top:12px;
}

.info{
  color:#888;
  font-size:13px;
  line-height:1.5;
}

footer{
  text-align:center;
  color:#666;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <h1>🎬 RSAI AI Video Generator</h1>
  <p>Free 9:16 Short Video Creator</p>
</header>

<div class="container">

<div class="card">

<h2>📝 Create Your Video</h2>

<label>Video Script</label>

<textarea
id="script"
placeholder="Write your video script here..."></textarea>

<label>🖼️ Upload Image</label>

<input
type="file"
id="imageInput"
accept="image/*">

<div class="preview" id="preview">
  Image Preview
</div>

<label>🎵 Background Music</label>

<input
type="file"
id="musicInput"
accept="audio/*">

<p class="info">
Upload MP3, WAV or other browser-supported audio.
</p>

<button id="voiceBtn">
🔊 Play AI Voice
</button>

<button id="videoBtn">
🎬 Generate 9:16 Video
</button>

<div class="status" id="status"></div>

</div>


<div class="card">

<h2>🎥 Final Video</h2>

<video
id="video"
controls
playsinline>
</video>

<button
id="downloadBtn"
disabled>
⬇️ Download Video
</button>

</div>

</div>

<footer>
RSAI © 2026
</footer>


<script>

let uploadedImage = null;
let musicFile = null;
let videoURL = null;


/* =========================
IMAGE UPLOAD
========================= */

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

imageInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
alert("Please upload an image.");
return;
}

const reader=new FileReader();

reader.onload=function(e){

uploadedImage=new Image();

uploadedImage.onload=function(){

preview.innerHTML="";

const img=document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

setStatus("✅ Image uploaded!");

};

uploadedImage.src=e.target.result;

};

reader.readAsDataURL(file);

});


/* =========================
MUSIC UPLOAD
========================= */

const musicInput =
document.getElementById("musicInput");

musicInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

if(!file.type.startsWith("audio/")){
alert("Please upload an audio file.");
return;
}

musicFile=file;

setStatus("🎵 Music ready!");

});


/* =========================
STATUS
========================= */

function setStatus(text){

document.getElementById("status")
.textContent=text;

}


/* =========================
VOICE
========================= */

const voiceBtn =
document.getElementById("voiceBtn");

voiceBtn.addEventListener("click",function(){

const text=
document.getElementById("script")
.value.trim();

if(!text){

alert("Write your script first.");

return;

}

if(!window.speechSynthesis){

alert("Voice is not supported.");

return;

}

speechSynthesis.cancel();

const voice=
new SpeechSynthesisUtterance(text);

voice.rate=1;
voice.pitch=1;
voice.volume=1;

voice.onstart=function(){

setStatus("🔊 Voice playing...");

};

voice.onend=function(){

setStatus("✅ Voice finished.");

};

speechSynthesis.speak(voice);

});


/* =========================
VIDEO GENERATOR
========================= */

const videoBtn =
document.getElementById("videoBtn");

videoBtn.addEventListener("click",async function(){

const script=
document.getElementById("script")
.value.trim();

if(!script){

alert("Please enter a script.");

return;

}

if(!uploadedImage){

alert("Please upload an image.");

return;

}

if(!window.MediaRecorder){

alert("Your browser does not support video recording.");

return;

}

videoBtn.disabled=true;

setStatus("🎬 Preparing video...");


try{

const canvas=
document.createElement("canvas");

canvas.width=720;
canvas.height=1280;

const ctx=
canvas.getContext("2d");

const stream=
canvas.captureStream(30);

const chunks=[];

let recorder;

try{

recorder=
new MediaRecorder(
stream,
{
mimeType:"video/webm;codecs=vp9"
}
);

}catch(e){

recorder=
new MediaRecorder(stream);

}


/* =========================
AUDIO
========================= */

let audioContext=null;
let audioSource=null;
let musicAudio=null;

if(musicFile){

try{

audioContext=
new AudioContext();

musicAudio=
new Audio();

musicAudio.src=
URL.createObjectURL(musicFile);

musicAudio.loop=true;

audioSource=
audioContext.createMediaElementSource(
musicAudio
);

const destination=
audioContext.createMediaStreamDestination();

audioSource.connect(destination);

audioSource.connect(
audioContext.destination
);

const audioTracks=
destination.stream.getAudioTracks();

audioTracks.forEach(track=>{
stream.addTrack(track);
});

}catch(e){

console.log("Audio error:",e);

}

}


/* =========================
RECORDER
========================= */

recorder.ondataavailable=function(e){

if(e.data.size>0){

chunks.push(e.data);

}

};


recorder.onstop=function(){

const blob=
new Blob(
chunks,
{
type:"video/webm"
}
);

videoURL=
URL.createObjectURL(blob);

const video=
document.getElementById("video");

video.src=videoURL;

document.getElementById(
"downloadBtn"
).disabled=false;

if(musicAudio){

musicAudio.pause();

}

setStatus(
"✅ Video created successfully!"
);

videoBtn.disabled=false;

};


/* =========================
START
========================= */

recorder.start();

if(musicAudio){

musicAudio.play().catch(()=>{});

}

const duration=10000;

const start=Date.now();


/* =========================
DRAW VIDEO
========================= */

function draw(){

const elapsed=
Date.now()-start;

const progress=
elapsed/duration;


/* BACKGROUND */

ctx.fillStyle="#000";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* IMAGE */

const imgRatio=
uploadedImage.width/
uploadedImage.height;

const canvasRatio=
canvas.width/
canvas.height;

let width;
let height;
let x;
let y;


if(imgRatio>canvasRatio){

height=canvas.height;

width=
height*imgRatio;

x=
(canvas.width-width)/2;

y=0;

}else{

width=canvas.width;

height=
width/imgRatio;

x=0;

y=
(canvas.height-height)/2;

}


/* ZOOM */

const zoom=
1+(progress*0.10);

ctx.save();

ctx.translate(
canvas.width/2,
canvas.height/2
);

ctx.scale(
zoom,
zoom
);

ctx.translate(
-canvas.width/2,
-canvas.height/2
);

ctx.drawImage(
uploadedImage,
x,
y,
width,
height
);

ctx.restore();


/* DARK OVERLAY */

const gradient=
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

gradient.addColorStop(
0,
"rgba(0,0,0,0.05)"
);

gradient.addColorStop(
0.55,
"rgba(0,0,0,0.10)"
);

gradient.addColorStop(
1,
"rgba(0,0,0,0.80)"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* =========================
TEXT
========================= */

const words=
script.split(/\s+/);

const amount=
Math.ceil(
words.length*
Math.min(progress+0.10,1)
);

const visible=
words
.slice(0,amount)
.join(" ");

ctx.font=
"bold 40px Arial";

ctx.textAlign="center";

ctx.fillStyle="#fff";

const maxWidth=620;

const lines=[];

let line="";

visible
.split(" ")
.forEach(word=>{

const test=
line+
word+
" ";

if(
ctx.measureText(test)
.width>maxWidth
){

lines.push(line);

line=
word+" ";

}else{

line=test;

}

});

if(line){
lines.push(line);
}


/* TEXT BACKGROUND */

const lineHeight=54;

const startY=
canvas.height-
(
lines.length*
lineHeight
)-
100;


lines.forEach(
(text,index)=>{

const textWidth=
ctx.measureText(text)
.width;

ctx.fillStyle=
"rgba(0,0,0,0.65)";

ctx.fillRect(
canvas.width/2-
textWidth/2-
18,
startY+
index*lineHeight-
40,
textWidth+36,
55
);

ctx.fillStyle="#fff";

ctx.fillText(
text,
canvas.width/2,
startY+
index*lineHeight
);

});


/* BRAND */

ctx.font=
"bold 28px Arial";

ctx.fillStyle=
"rgba(255,255,255,0.85)";

ctx.fillText(
"RSAI",
canvas.width-70,
55
);


/* LOOP */

if(elapsed<duration){

requestAnimationFrame(draw);

}else{

recorder.stop();

}

}

draw();


}catch(error){

console.error(error);

setStatus(
"❌ Video generation failed."
);

videoBtn.disabled=false;

}

});


/* =========================
DOWNLOAD
========================= */

document
.getElementById("downloadBtn")
.addEventListener("click",function(){

if(!videoURL)return;

const link=
document.createElement("a");

link.href=videoURL;

link.download=
"RSAI_AI_Video.webm";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

});


</script>

</body>
  </html>
